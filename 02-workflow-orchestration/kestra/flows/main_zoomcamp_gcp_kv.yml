id: gcp_kv
namespace: zoomcamp

tasks:
  - id: gcp_project_id
    type: io.kestra.plugin.core.kv.Set
    key: GCP_PROJECT_ID
    kvType: STRING
    value: "{{ envs.gcp_project_id }}"

  - id: gcp_region
    type: io.kestra.plugin.core.kv.Set
    key: GCP_REGION
    kvType: STRING
    value: "{{ envs.gcp_region }}"

  - id: gcp_bucket_name
    type: io.kestra.plugin.core.kv.Set
    key: GCP_BUCKET_NAME
    kvType: STRING
    value: "{{ envs.gcp_bucket_name }}"

  - id: gcp_dataset
    type: io.kestra.plugin.core.kv.Set
    key: GCP_DATASET
    kvType: STRING
    value: "{{ envs.gcp_dataset }}"